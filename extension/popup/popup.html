<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>LiquiSight</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      min-height: 180px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #0a1020 0%, #080c18 50%, #050810 100%);
      color: #ffffff;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #00D4FF 0%, #0088CC 100%);
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
      font-size: 18px;
    }

    .title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #00D4FF 0%, #00F5D4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b7a99;
    }

    /* Auth View */
    #authView {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #authView.hidden { display: none; }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 10px;
      color: #6b7a99;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-group input {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(30, 50, 80, 0.6);
      background: rgba(15, 25, 45, 0.8);
      color: #ffffff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-group input::placeholder {
      color: #5a6a88;
    }

    .input-group input:focus {
      border-color: rgba(0, 212, 255, 0.5);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0066FF 0%, #00D4FF 100%);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 102, 255, 0.4);
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(0, 102, 255, 0.5);
    }

    .hint {
      font-size: 10px;
      color: #5a6a88;
      text-align: center;
    }

    #status {
      font-size: 10px;
      color: #ff6b6b;
      text-align: center;
      min-height: 14px;
    }

    /* Main View (after login) */
    #mainView {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    #mainView.active { display: flex; }

    .user-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(15, 25, 45, 0.6);
      border: 1px solid rgba(30, 50, 80, 0.5);
    }

    .user-email {
      font-size: 11px;
      color: #00D4FF;
    }

    .logout-btn {
      font-size: 10px;
      color: #6b7a99;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .logout-btn:hover {
      color: #ff6b6b;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0066FF 0%, #00D4FF 100%);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 102, 255, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(0, 102, 255, 0.5);
    }

    .action-btn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
      50% { box-shadow: 0 0 0 6px rgba(255, 255, 255, 0); }
    }

    .shortcut-hint {
      font-size: 10px;
      color: #5a6a88;
      text-align: center;
    }

    .shortcut-hint kbd {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(30, 50, 80, 0.6);
      color: #00D4FF;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">💧</div>
    <div class="title-wrap">
      <div class="title">LiquiSight</div>
      <div class="subtitle">AI Financial Copilot</div>
    </div>
  </div>

  <!-- Auth View -->
  <div id="authView">
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" />
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" />
    </div>
    <div id="status"></div>
    <button class="login-btn" id="loginBtn">Login to LiquiSight</button>
    <div class="hint">Enter any email/password to continue</div>
  </div>

  <!-- Main View (after login) -->
  <div id="mainView">
    <div class="user-badge">
      <span class="user-email" id="userEmail"></span>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
    <button class="action-btn" id="activateBtn">
      <span class="dot"></span>
      Open LiquiSight Panel
    </button>
    <div class="shortcut-hint">Or press <kbd>Alt + L</kbd> on any page</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
